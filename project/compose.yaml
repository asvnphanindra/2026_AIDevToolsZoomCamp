name: work-planner

services:
  stack:
    build: .
    image: work-planner:local
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9150:9150"
    environment:
      VITE_USE_EMULATORS: "true"
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
      VITE_FIRESTORE_EMULATOR_PORT: "8080"
    restart: unless-stopped
