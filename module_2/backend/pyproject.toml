[project]
name = "weekslot-backend"
version = "0.1.0"
description = "FastAPI backend for Weekslot (module_2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "pwdlib[bcrypt]>=0.2.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
